<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./button.css">
</head>

<body>


    <main>

        <canvas id="canvas" width="400" height="400" style="border:1px solid #000000; display: none"></canvas>

        <section>
            <button onclick="loadImage()" class="pure-material-button-contained">Carregar imagem</button>
            <input type="file" id="input_file">
        </section>

        <!-- <section>
            <h3>URL DA IMAGEM</h3>
            <div class="material_input">
                <p>url da imagem</p>
                <input type="text" required pattern="" placeholder="http://exemplo.com/foto.jpg">
            </div>
            <br>
            <button onclick="carregarImagem()" class="pure-material-button-contained">Carregar foto</button>
        </section> -->

        <section>
            <h3>TESTE</h3>
            <button onclick="example1()" class="pure-material-button-contained">Exemplo 1</button>
            <button onclick="example2()" class="pure-material-button-contained">Exemplo 2</button>
        </section>

        <section>
            <h3>NOME DO ARQUIVO</h3>
            <div class="material_input">
                <p>nome do arquivo</p>
                <input id="input_name_file" type="text" required pattern="" value="coffee_%1d.png">
            </div>
        </section>

        <div class="blocos">
            <div class="bloco">
                <label>
                    <p>picture width</p>
                    <input id="range_picture_width" value="240" type="range" min="0" max="500" step="1">
                </label>
                <label>
                    <p>picture height</p>
                    <input id="range_picture_height" value="240" type="range" min="0" max="500" step="1">
                </label>
            </div>

            <div class="bloco">
                <label>
                    <p>distance_left</p>
                    <input id="range_distance_left" value="-7" type="range" min="-100" max="200" step="1">
                </label>
                <label>
                    <p>distance_top</p>
                    <input id="range_distance_top" value="8" type="range" min="-100" max="200" step="1">
                </label>
            </div>
            <div class="bloco">
                <label>
                    <p>distance_x</p>
                    <input id="range_distance_x" value="6" type="range" min="-200" max="200" step="1">
                </label>
                <label>
                    <p>distance_y</p>
                    <input id="range_distance_y" value="5" type="range" min="-200" max="200" step="1">
                </label>
            </div>
            <div class="bloco">
                <label>
                    <p>translate_x</p>
                    <input id="range_translate_x" value="5" type="range" min="-200" max="200" step="1">
                </label>
                <label>
                    <p>translate_y</p>
                    <input id="range_translate_y" value="5" type="range" min="-200" max="200" step="1">
                </label>
            </div>
            <div class="bloco">
                <label>
                    <p>scale</p>
                    <input id="range_scale" value="1" type="range" min="0" max="3" step="0.01">
                </label>
                
            </div>
        </div>

        <pre id="information_properties" class="blocos2">
            
        </pre>

        <section>
            <h3>FOTOS CORTADA</h3>
            <button onclick="downloadAllImages()" class="pure-material-button-contained">Download fotos</button>
            <br>
        </section>

        <div id="tagFotos"></div>

    </main>

</body>

</html>
